<!doctype html>
<meta charset="utf-8">
<title>Video showing a live stream</title>
<script src="recorder.js"></script>
<canvas id="source" width="16" height="16"></canvas>
<video id="stream" muted></video>
<script>
  // Stands in for a remote desktop or video call: a MediaStream has no timeline.
  // Drawing once the stream exists gives it a frame: Chrome holds the page's
  // load event until the video has one.
  const source = document.getElementById("source");
  const context = source.getContext("2d");
  document.getElementById("stream").srcObject = source.captureStream();
  context.fillRect(0, 0, 1, 1);
</script>

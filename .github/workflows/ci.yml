name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The oldest version allowed by "engines" in package.json.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Firefox and Chrome ship with the runner image; the tests start them headless.
      - run: firefox --version
      - run: google-chrome --version
      - run: npm test
      - run: npm run build:chromium
